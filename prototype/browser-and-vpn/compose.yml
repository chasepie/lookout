# PROTOTYPE for issue #2. Throwaway: lives only on the prototype/browser-and-vpn branch.
name: lookout-prototype

services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.57.1
    environment:
      CONCURRENT: "4"
      TIMEOUT: "1800000"
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 2g

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      # OPENVPN_USER and OPENVPN_PASSWORD; gitignored by *.env
      - path: ../../pia.env
        required: false
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      SERVER_REGIONS: ${SERVER_REGIONS:-US East,US New York,US Florida,US California,US Chicago,US Texas,US Washington DC,US Atlanta}
      # The server list bundled in v3.41.3 is from 2026-04-22 and many of its IPs are dead. The wiki asks for
      # no less than 360h, so PIA doesn't block the updater; refresh on demand via PUT /v1/updater/status too
      UPDATER_PERIOD: ${UPDATER_PERIOD:-360h}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-tcp}
      # e.g. "--connect-retry-max 1 --connect-timeout 10" so OpenVPN exits on a dead TCP server and gluetun re-picks
      OPENVPN_FLAGS: ${OPENVPN_FLAGS:-}
      HTTPPROXY: "on"
      HTTPPROXY_STEALTH: ${HTTPPROXY_STEALTH:-off}
      TZ: America/New_York
    volumes:
      - gluetun-data:/gluetun
      - ./gluetun-auth.toml:/gluetun/auth/config.toml:ro
    ports:
      # Control server only; the proxy (8888) is reached by Browserless over the compose network
      - "127.0.0.1:8000:8000"

volumes:
  gluetun-data:
