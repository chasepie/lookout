services:
  browserless:
    image: "ghcr.io/browserless/chromium:v2.58.3"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      TIMEOUT: "180000"
      TOKEN: "${BROWSERLESS_TOKEN}"
    networks:
      - "browsers"
      - "vpn-proxy"
      - "egress"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${LOOKOUT_BROWSERLESS_MEMORY:-2g}"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
  runner:
    image: "ghcr.io/chasepie/lookout-runner:${LOOKOUT_IMAGE_TAG:-main}"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      LOOKOUT_BROWSERLESS_URL: "http://browserless:3000"
      LOOKOUT_BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN}"
      LOOKOUT_VPN_PROXY_URL: "http://lookout@gluetun:8888"
    volumes:
      - type: "volume"
        target: "/app/scripts"
        source: "scripts"
        read_only: true
    depends_on:
      browserless:
        condition: "service_started"
    networks:
      - "runner"
      - "browsers"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${LOOKOUT_RUNNER_MEMORY:-1g}"
    cap_drop:
      - "ALL"
    init: true
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    secrets:
      - source: "runner_api_key"
        target: "LOOKOUT_RUNNER_API_KEY"
      - source: "vpn_proxy_password"
        target: "LOOKOUT_VPN_PROXY_PASSWORD"
    tmpfs:
      - "/tmp"
  backend:
    image: "ghcr.io/chasepie/lookout-backend:${LOOKOUT_IMAGE_TAG:-main}"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      AllowedHosts: "${LOOKOUT_HOST}"
      LOOKOUT_TRUSTED_PROXIES: "${LOOKOUT_TRUSTED_PROXIES:-}"
      LOOKOUT_OWNER_USERNAME: "${LOOKOUT_OWNER_USERNAME}"
      LOOKOUT_RUNNER_URL: "http://runner:8080"
      LOOKOUT_GLUETUN_URL: "http://gluetun-control:8000"
      LOOKOUT_GLUETUN_API_KEY: "${GLUETUN_API_KEY}"
      LOOKOUT_GLUETUN_DIR: "/app/gluetun"
      LOOKOUT_VPN_PROXY_URL: "http://lookout@gluetun-proxy:8888"
    ports:
      - "${LOOKOUT_BIND_ADDRESS:-127.0.0.1}:${LOOKOUT_PORT:-8080}:8080"
    volumes:
      - type: "volume"
        target: "/app/scripts"
        source: "scripts"
        read_only: false
      - type: "volume"
        target: "/app/database"
        source: "database"
        read_only: false
      - type: "volume"
        target: "/app/gluetun"
        source: "gluetun"
        read_only: true
    depends_on:
      runner:
        condition: "service_started"
    networks:
      - "runner"
      - "vpn-control"
      - "edge"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    init: true
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    secrets:
      - source: "owner_password"
        target: "LOOKOUT_OWNER_PASSWORD"
      - source: "runner_api_key"
        target: "LOOKOUT_RUNNER_API_KEY"
      - source: "vpn_proxy_password"
        target: "LOOKOUT_VPN_PROXY_PASSWORD"
    tmpfs:
      - "/tmp"
  gluetun:
    image: "qmcgaw/gluetun:v3"
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-private internet access}"
      VPN_TYPE: "openvpn"
      HTTPPROXY: "on"
      HTTPPROXY_USER: "lookout"
      HTTPPROXY_STEALTH: "on"
      TZ: "${TZ:-Etc/UTC}"
      UPDATER_PERIOD: "360h"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: "/gluetun-auth/config.toml"
    volumes:
      - type: "volume"
        target: "/gluetun"
        source: "gluetun"
        read_only: false
    networks:
      - "vpn-proxy"
      - "gluetun-relay"
      - "egress"
    restart: "unless-stopped"
    cap_add:
      - "NET_ADMIN"
    devices:
      - "/dev/net/tun:/dev/net/tun"
    secrets:
      - source: "openvpn_user"
        target: "openvpn_user"
      - source: "openvpn_password"
        target: "openvpn_password"
      - source: "vpn_proxy_password"
        target: "httpproxy_password"
    configs:
      - source: "gluetun_auth"
        target: "/gluetun-auth/config.toml"
  gluetun-control:
    image: "alpine/socat:1.8.0.3"
    command:
      - "TCP-LISTEN:8000,fork,reuseaddr"
      - "TCP:gluetun:8000"
    user: "65534:65534"
    networks:
      - "vpn-control"
      - "gluetun-relay"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
  gluetun-proxy:
    image: "alpine/socat:1.8.0.3"
    command:
      - "TCP-LISTEN:8888,fork,reuseaddr"
      - "TCP:gluetun:8888"
    user: "65534:65534"
    networks:
      - "vpn-control"
      - "gluetun-relay"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
networks:
  runner:
    driver: "bridge"
    internal: true
  browsers:
    driver: "bridge"
    internal: true
  vpn-proxy:
    driver: "bridge"
    internal: true
  gluetun-relay:
    driver: "bridge"
    internal: true
  vpn-control:
    driver: "bridge"
    internal: true
  egress:
    driver: "bridge"
  edge:
    driver: "bridge"
volumes:
  scripts: {}
  database: {}
  gluetun: {}
secrets:
  owner_password:
    file: "./secrets/owner_password"
    name: "owner_password"
  runner_api_key:
    file: "./secrets/runner_api_key"
    name: "runner_api_key"
  vpn_proxy_password:
    file: "./secrets/vpn_proxy_password"
    name: "vpn_proxy_password"
  openvpn_user:
    file: "./secrets/openvpn_user"
    name: "openvpn_user"
  openvpn_password:
    file: "./secrets/openvpn_password"
    name: "openvpn_password"
configs:
  gluetun_auth:
    content: "[[roles]]\nname = \"lookout-backend\"\nroutes = [\"GET /v1/vpn/settings\", \"PUT /v1/vpn/settings\", \"GET /v1/publicip/ip\"]\nauth = \"apikey\"\napikey = \"${GLUETUN_API_KEY}\"\n"
