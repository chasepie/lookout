name: "lookout"
services:
  browserless:
    image: "ghcr.io/browserless/chromium:v2.60.0"
    environment:
      TIMEOUT: "180000"
      TZ: "${TZ:-Etc/UTC}"
      TOKEN: "${BROWSERLESS_TOKEN}"
    networks:
      - "browsers"
      - "vpn-proxy"
      - "egress"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${BROWSERLESS_MEMORY:-2g}"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
  runner:
    image: "ghcr.io/chasepie/lookout-runner:${LOOKOUT_IMAGE_TAG:?set it in .env to the release to run, such as 0.1}"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN}"
      BROWSERLESS_URL: "http://browserless:3000"
      GLUETUN_PROXY_PASSWORD: "${GLUETUN_PROXY_PASSWORD}"
      GLUETUN_PROXY_URL: "http://lookout@gluetun:8888"
      LOOKOUT_RUNNER_API_KEY: "${LOOKOUT_RUNNER_API_KEY}"
    volumes:
      - type: "volume"
        target: "/app/scripts"
        source: "scripts"
        read_only: true
    depends_on:
      browserless:
        condition: "service_started"
    networks:
      - "runner"
      - "browsers"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${LOOKOUT_RUNNER_MEMORY:-1g}"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
  backend:
    image: "ghcr.io/chasepie/lookout-backend:${LOOKOUT_IMAGE_TAG:?set it in .env to the release to run, such as 0.1}"
    environment:
      AllowedHosts: "${LOOKOUT_HOST}"
      TZ: "${TZ:-Etc/UTC}"
      GLUETUN_API_KEY: "${GLUETUN_API_KEY}"
      GLUETUN_DATA_DIR: "/app/gluetun"
      GLUETUN_PROXY_PASSWORD: "${GLUETUN_PROXY_PASSWORD}"
      GLUETUN_PROXY_URL: "http://lookout@gluetun-proxy:8888"
      GLUETUN_SERVER_REGIONS: "${GLUETUN_SERVER_REGIONS:-}"
      GLUETUN_URL: "http://gluetun-control:8000"
      LOOKOUT_OWNER_PASSWORD: "${LOOKOUT_OWNER_PASSWORD}"
      LOOKOUT_OWNER_USERNAME: "${LOOKOUT_OWNER_USERNAME}"
      LOOKOUT_PUBLIC_URL: "https://${LOOKOUT_HOST}"
      LOOKOUT_RUNNER_API_KEY: "${LOOKOUT_RUNNER_API_KEY}"
      LOOKOUT_RUNNER_URL: "http://runner:8080"
      LOOKOUT_TRUSTED_PROXIES: "${LOOKOUT_TRUSTED_PROXIES:-}"
    ports:
      - "${LOOKOUT_BIND_ADDRESS:-127.0.0.1}:${LOOKOUT_PORT:-8080}:8080"
    volumes:
      - type: "volume"
        target: "/app/scripts"
        source: "scripts"
        read_only: false
      - type: "volume"
        target: "/app/database"
        source: "database"
        read_only: false
      - type: "volume"
        target: "/app/gluetun"
        source: "gluetun"
        read_only: true
    depends_on:
      runner:
        condition: "service_started"
    networks:
      - "runner"
      - "vpn-control"
      - "edge"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
  gluetun:
    image: "qmcgaw/gluetun:v3.41.3"
    environment:
      VPN_TYPE: "openvpn"
      HTTPPROXY: "on"
      HTTPPROXY_USER: "lookout"
      HTTPPROXY_STEALTH: "on"
      UPDATER_PERIOD: "360h"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: "/gluetun-auth/config.toml"
      TZ: "${TZ:-Etc/UTC}"
      VPN_SERVICE_PROVIDER: "${GLUETUN_VPN_SERVICE_PROVIDER:-private internet access}"
      SERVER_REGIONS: "${GLUETUN_SERVER_REGIONS:-}"
      OPENVPN_USER: "${GLUETUN_OPENVPN_USER}"
      OPENVPN_PASSWORD: "${GLUETUN_OPENVPN_PASSWORD}"
      HTTPPROXY_PASSWORD: "${GLUETUN_PROXY_PASSWORD}"
    volumes:
      - type: "volume"
        target: "/gluetun"
        source: "gluetun"
        read_only: false
    networks:
      - "vpn-proxy"
      - "gluetun-relay"
      - "egress"
    restart: "unless-stopped"
    cap_add:
      - "NET_ADMIN"
    devices:
      - "/dev/net/tun:/dev/net/tun"
    configs:
      - source: "gluetun_auth"
        target: "/gluetun-auth/config.toml"
  gluetun-control:
    image: "alpine/socat:1.8.0.3"
    command:
      - "TCP-LISTEN:8000,fork,reuseaddr"
      - "TCP:gluetun:8000"
    user: "65534:65534"
    networks:
      - "vpn-control"
      - "gluetun-relay"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
  gluetun-proxy:
    image: "alpine/socat:1.8.0.3"
    command:
      - "TCP-LISTEN:8888,fork,reuseaddr"
      - "TCP:gluetun:8888"
    user: "65534:65534"
    networks:
      - "vpn-control"
      - "gluetun-relay"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp"
networks:
  runner:
    driver: "bridge"
    internal: true
  browsers:
    driver: "bridge"
    internal: true
  vpn-proxy:
    driver: "bridge"
    internal: true
  gluetun-relay:
    driver: "bridge"
    internal: true
  vpn-control:
    driver: "bridge"
    internal: true
  egress:
    driver: "bridge"
  edge:
    driver: "bridge"
    ipam:
      config:
        - subnet: "${LOOKOUT_EDGE_SUBNET:-172.30.240.0/24}"
volumes:
  scripts:
    driver: "local"
  database:
    driver: "local"
  gluetun:
    driver: "local"
configs:
  gluetun_auth:
    content: "[[roles]]\nname = \"lookout-backend\"\nroutes = [\"GET /v1/vpn/settings\", \"PUT /v1/vpn/settings\", \"GET /v1/publicip/ip\"]\nauth = \"apikey\"\napikey = \"${GLUETUN_API_KEY}\"\n"
