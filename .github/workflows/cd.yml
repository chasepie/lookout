name: CD

# Publishes the images the deployment (deploy/) runs to GHCR, and the watch SDK to GitHub Packages, once CI has passed for
# a push to main or a release tag. Images: main gets main and sha-<commit>, and a v* tag also its version and latest. Each
# platform is built natively and pushed by digest, and then the two are joined under the tags. The SDK: see its job.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# One publish per branch or tag at a time. Runs are queued in the order CI finishes, not the order of their commits, so
# the publish job also checks that main and latest only move forward.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Every other job needs this one, so its condition is theirs too
  tags:
    name: Check which tags may move
    # Only pushes: CI also runs for pull requests, whose images aren't published. For a tag push, head_branch is the tag.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      main: ${{ steps.moving.outputs.main }}
      latest: ${{ steps.moving.outputs.latest }}

    steps:
      # A re-run of an older commit's CI mustn't move main or latest back: main only moves to main's current head, and
      # latest only to the highest stable version, so never to a pre-release such as v1.3.0-rc.1
      - name: Check which tags may move
        id: moving
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main=false
          latest=false
          if [ "$REF" = main ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$HEAD_SHA" ]; then
            main=true
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ "$REF" = "$highest" ]; then
              latest=true
            fi
          fi
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: tags
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]
        arch: [amd64, arm64]
        include:
          - image: lookout-backend
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/Runner/Dockerfile
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      # The commit CI tested, not the default branch's latest
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged, by digest: the publish job tags both platforms' images together
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The source links the package to this repository on GHCR
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [tags, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the run CI tested, since this workflow's own ref and SHA are the default branch's
      - name: Short commit
        id: commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      # head_branch is main, or the release's tag
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ needs.tags.outputs.main == 'true' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=raw,value=latest,enable=${{ needs.tags.outputs.latest == 'true' }}

      - name: Tag both platforms' images
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ steps.commit.outputs.short }}
        run: docker buildx imagetools inspect "$IMAGE"

  # The watch SDK, for writing watch scripts outside this repo, in step with the images: main publishes
  # 0.0.0-main.<commit time>.sha-<commit> under the dist-tag main, and a v* tag publishes its version under latest. npm
  # versions can't be replaced and every publish sets a dist-tag, so a version that's already published is skipped, a
  # re-run of an older main commit publishes nothing, a pre-release goes under next, and a release older than latest
  # under release-<major>.<minor>.
  publish-watch-sdk:
    name: Publish watch SDK
    needs: tags
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      # The commit CI tested, not the default branch's latest
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version and dist-tag
        id: version
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN: ${{ needs.tags.outputs.main }}
          LATEST: ${{ needs.tags.outputs.latest }}
        run: |
          if [ "$REF" = main ]; then
            if [ "$MAIN" != true ]; then
              echo "::notice::Not publishing the watch SDK: $HEAD_SHA is no longer main's head."
              exit 0
            fi
            # The committer date, when the commit landed on main, so later commits get higher versions
            time=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$HEAD_SHA")
            version="0.0.0-main.$time.sha-${HEAD_SHA::7}"
            tag=main
          elif [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            version=${REF#v}
            if [ "$LATEST" = true ]; then
              tag=latest
            else
              tag="release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            version=${REF#v}
            tag=next
          else
            echo "::error::$REF isn't a version tag such as v1.2.3 or v1.3.0-rc.1, so it has no watch SDK version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Writes an .npmrc that sends @chasepie's packages to GitHub Packages, with NODE_AUTH_TOKEN
      - if: steps.version.outputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@chasepie'

      - name: Check it isn't published yet
        id: published
        if: steps.version.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chasepie/lookout-watch-sdk@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::Not publishing the watch SDK: $VERSION is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Its dev dependencies build it, which npm publish does (prepack)
      - name: Publish
        if: steps.version.outputs.version != '' && steps.published.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm ci --workspace src/watch-sdk --ignore-scripts
          npm pkg set version="$VERSION" --workspace src/watch-sdk
          npm publish --workspace src/watch-sdk --tag "$TAG"
