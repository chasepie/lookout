name: CD

# Publishes the images the deployment (deploy/) runs to GHCR, and then the watch SDK to GitHub Packages, once CI has
# passed for a push to main or a release tag. Images: main gets main and sha-<commit>, and a v* tag also its version and
# latest. Each platform is built natively and pushed by digest, and then the two are joined under the tags. The SDK: see
# its job.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# One publish per branch or tag at a time. Runs are queued in the order CI finishes, not the order of their commits, so
# the publish jobs also check, right before moving them, that main and latest only move forward.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    # Only pushes: CI also runs for pull requests, whose images aren't published. For a tag push, head_branch is the tag.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]
        arch: [amd64, arm64]
        include:
          - image: lookout-backend
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/Runner/Dockerfile
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      # The commit CI tested, not the default branch's latest
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged, by digest: the publish job tags both platforms' images together
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The source links the package to this repository on GHCR
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the run CI tested, since this workflow's own ref and SHA are the default branch's
      - name: Short commit
        id: commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      # A re-run of an older commit's CI mustn't move main or latest back: main only moves to main's current head, and
      # latest only to the highest stable version, so never to a pre-release such as v1.3.0-rc.1. Checked here, just
      # before the move, so a re-run of this job checks again.
      - name: Check which tags may move
        id: moving
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main=false
          latest=false
          if [ "$REF" = main ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" = "$HEAD_SHA" ]; then
              main=true
            fi
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')
            highest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" | sort -V | tail -1)
            if [ "$REF" = "$highest" ]; then
              latest=true
            fi
          fi
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # head_branch is main, or the release's tag
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ steps.moving.outputs.main == 'true' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}

      - name: Tag both platforms' images
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ steps.commit.outputs.short }}
        run: docker buildx imagetools inspect "$IMAGE"

  # The watch SDK, for writing watch scripts outside this repo, once the images it matches are published: main as
  # 0.0.0-main.<commit time>.sha-<commit>, and a v* tag as its version. The dist-tag (main, latest or next) only moves
  # forward, judged against the registry: npm publishes every version under some dist-tag, so one that would move its
  # tag back goes under superseded instead (src/watch-sdk/scripts/publish-plan.ts).
  publish-watch-sdk:
    name: Publish watch SDK
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      # The commit CI tested, not the default branch's latest
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Writes an .npmrc that sends @chasepie's packages to GitHub Packages, with NODE_AUTH_TOKEN
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@chasepie'

      # Without the token, which only npm itself gets: the build runs the SDK's dev dependencies
      - name: Build
        run: |
          npm ci --workspace src/watch-sdk --ignore-scripts
          npm run build --workspace src/watch-sdk

      # What the registry has, to judge the dist-tag against: its packument, or no file before the first publish
      - name: Read the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/packument.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $NODE_AUTH_TOKEN" https://npm.pkg.github.com/@chasepie%2flookout-watch-sdk)
          case "$status" in
            200) ;;
            404) rm -f "$RUNNER_TEMP/packument.json" ;;
            *)
              echo "::error::Reading the watch SDK's packument failed with HTTP status $status."
              cat "$RUNNER_TEMP/packument.json" 2> /dev/null
              exit 1
              ;;
          esac

      - name: Version and dist-tag
        id: plan
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PACKUMENT_FILE: ${{ runner.temp }}/packument.json
        run: |
          set -euo pipefail
          # The committer date, so a later commit on main normally gets a higher version; the dist-tag only moves to a
          # higher one either way
          COMMIT_TIME=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$HEAD_SHA")
          export COMMIT_TIME
          node src/watch-sdk/scripts/publish-plan.ts

      # Already built, so --ignore-scripts keeps the build (prepack) from running again with the token
      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          npm pkg set version="$VERSION" --workspace src/watch-sdk
          npm publish --workspace src/watch-sdk --tag "$TAG" --ignore-scripts
