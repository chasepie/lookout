name: Release

# For each push to main, once CI passes: release-please keeps a Release PR open with the next version and changelog,
# from the Conventional Commit titles of the PRs merged since the last release. Merging the Release PR tags the release,
# and this workflow then publishes it: the images the deployment (deploy/) runs to GHCR, and the watch SDK to GitHub
# Packages. See docs/adr/0007-releases-with-release-please.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, so releases publish in order. Not the group ci.yml's jobs use when this calls it, which is
# Release-refs/heads/main: sharing one would deadlock.
concurrency:
  group: releases
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release PR
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # A token of the Owner's (RELEASE_PLEASE_TOKEN, see README.md), not GITHUB_TOKEN: GitHub runs no workflows for
      # what GITHUB_TOKEN does, and the Release PR needs CI to pass before main's ruleset lets it merge
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]
        arch: [amd64, arm64]
        include:
          - image: lookout-backend
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/Runner/Dockerfile
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      # The release's commit, which a later push's run can be the one to release
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged, by digest: the publish job tags both platforms' images together
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The source links the package to this repository on GHCR
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout-backend, lookout-runner]

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.4.3 gets 0.4.3, 0.4 and latest; from 1.0, also its major, 1. A 0.x major isn't published: within it, a minor
      # is what breaks compatibility, so a deployment follows 0.4, as it later follows 1.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.major != '0' }}
            type=raw,value=latest

      - name: Tag both platforms' images
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.release-please.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"

  # The watch SDK, for writing watch scripts outside this repo, at the version of the images it matches. Once they're
  # published, so the SDK never names a release Lookout doesn't have.
  publish-watch-sdk:
    name: Publish watch SDK
    needs: [release-please, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Writes an .npmrc that sends @chasepie's packages to GitHub Packages, with NODE_AUTH_TOKEN
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@chasepie'

      # Without the token: the build runs the SDK's dev dependencies. The Release PR set the SDK's version, which this
      # checks, so a release never publishes another version's SDK.
      - name: Build
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          sdk_version=$(node -p "require('./src/watch-sdk/package.json').version")
          if [ "$sdk_version" != "$VERSION" ]; then
            echo "::error::The watch SDK's package.json says $sdk_version, but this is release $VERSION."
            exit 1
          fi
          npm ci --workspace src/watch-sdk --ignore-scripts
          npm run build --workspace src/watch-sdk

      # Already built, so --ignore-scripts keeps the build (prepack) from running again with the token
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace src/watch-sdk --ignore-scripts
