name: PR title

# Squash merges make a PR's title its commit on main, which release-please reads to pick the next version, so titles
# must be Conventional Commits: `fix: …` releases a patch, `feat: …` a minor and `feat!: …` a major (before 1.0, a patch
# and a minor). main's ruleset requires it. pull_request, not pull_request_target: reading the title needs only a
# read-only token, and it runs this file from the PR's branch, so a PR that changes it checks itself.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: Check PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
