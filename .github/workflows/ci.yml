name: CI

on:
  push:
    branches: [main]
    # A release, from gh release create (see "Releasing" in README.md)
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required checks in the "Merge Gate" ruleset; rename a job there too.
# Only Backend installs .NET; both jobs need Node and Chromium, for the real-runner and runner tests.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # The browser tests take a few minutes; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
          # Currently broken with 10.0.403 release
          # global-json-file: global.json

      - name: Build
        run: dotnet build Lookout.slnx

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Test backend and runner client
        run: dotnet test --solution Lookout.slnx --no-build

      - name: Test frontend against the backend with a fake runner
        run: npm run test:e2e

  node:
    name: Runner and Scripting
    runs-on: ubuntu-latest
    # The runner tests take under a minute; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These tests use local pages; examples/ contacts a real bot-detection site.
      - name: Test runner
        run: npm run test:runner

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # What compose.yaml deploys, so an image that no longer builds fails here rather than on a homelab. Running
      # the stack against the real Browserless is the README's manual smoke test.
      - name: Build
        run: docker compose build

  # Publishing, once every check above has passed. Pull requests skip it. A push to main publishes edge builds, and a
  # release tag (v*) publishes that version; see "Releasing" in README.md. A newer push to main cancels this run (see
  # concurrency), so an older commit can't finish last and overwrite edge.
  publish-images:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, node, images]
    runs-on: ubuntu-latest
    # The arm64 build runs partly under emulation, which takes longer than the images job
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: lookout
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/runner/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # arm64 too, for homelabs on a Raspberry Pi. The lookout image's build stages run on the build machine's own
      # platform; only its last stage and the runner image's build run under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From main: edge, and the commit's sha-<short SHA> to pin or roll back to. From a release tag such as v0.2.0:
      # 0.2.0, 0.2 and latest. A pre-release such as v0.2.0-rc.1 gets only 0.2.0-rc.1. Lookout and the runner are
      # released together, so a release's two images always match. The labels include the source repository, which
      # links the package to this repository on GitHub.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # For a multi-platform image, GHCR reads the description from the index
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Built from the repository root with .dockerignore, as compose.yaml builds it
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Publishes the types Scripts import, with the same conditions as the images job above
  publish-scripting:
    name: Publish scripting package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, node, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com

      # The root's devDependencies hold the TypeScript that builds the package's types
      - run: npm ci --workspace src/scripting --include-workspace-root

      # Only when what users would install differs from the last edge, or the last release before the first edge: its
      # files, and the package.json fields that resolve them and name its dependencies. Comparing what's published,
      # rather than which files a push changed, ignores changes that don't reach users, and catches up after a run
      # that was cancelled. The version is the next patch after the last release, such as 0.2.1-edge.<run number>.
      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        run: |
          name=$(node --print "require('./src/scripting/package.json').name")
          work=$(mktemp -d)
          mkdir "$work/new" "$work/old"
          npm pack --workspace src/scripting --pack-destination "$work/new"
          tar -xzf "$work"/new/*.tgz -C "$work/new"

          published=$(npm view "$name@edge" version 2>/dev/null) || published=$(npm view "$name@latest" version 2>/dev/null) || true
          if [ -n "$published" ]; then
            npm pack "$name@$published" --pack-destination "$work/old"
            tar -xzf "$work"/old/*.tgz -C "$work/old"
            fields() {
              node --print "const p = require(process.argv[1]);
                JSON.stringify([p.types, p.exports, p.dependencies, p.peerDependencies, p.peerDependenciesMeta])" \
                "$1/package/package.json"
            }
            if diff --recursive --exclude=package.json "$work/old/package" "$work/new/package" \
              && [ "$(fields "$work/old")" = "$(fields "$work/new")" ]; then
              echo "$name@$published already has these types"
              exit 0
            fi
          fi

          # Before the first release, package.json's version. Until then, latest is the first edge, as a registry tags a
          # package's first version latest whatever tag it was published with.
          latest=$(npm view "$name@latest" version 2>/dev/null) || true
          if [ -n "$latest" ] && [[ $latest != *-* ]]; then
            base=$(node --print "const [major, minor, patch] = process.argv[1].split('.');
              [major, minor, Number(patch) + 1].join('.')" "$latest")
          else
            base=$(node --print "require('./src/scripting/package.json').version")
          fi
          npm pkg set version="$base-edge.$GITHUB_RUN_NUMBER" --workspace src/scripting
          npm publish --workspace src/scripting --tag edge

      # At the release's version, whether or not the types changed, so a Script's types match the Lookout it runs on.
      # The tag sets the version; package.json's isn't bumped for a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          npm pkg set version="$version" --workspace src/scripting
          # npm publishes a pre-release, such as 0.2.0-rc.1, only under a tag other than latest
          if [[ $version == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --workspace src/scripting --tag "$tag"
