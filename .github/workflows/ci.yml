name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore
        run: |
          npm ci
          dotnet tool restore
          dotnet restore Lookout.slnx

      # The SDK goes first: the Runner and examples resolve its types from dist/
      - name: Build watch SDK
        run: npm run build -w src/watch-sdk

      - name: Build frontend
        run: npm run build -w src/frontend

      # Analyzers and code style are enforced here too (EnforceCodeStyleInBuild, TreatWarningsAsErrors)
      - name: Build .NET
        run: dotnet build Lookout.slnx -c Release --no-restore

      - name: Lint TypeScript
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Check .NET formatting
        run: dotnet format whitespace Lookout.slnx --verify-no-changes

      # Exit code 8 means a test project ran zero tests; the Runner test projects have none yet
      - name: Test .NET
        run: >
          dotnet test --solution Lookout.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura
          --ignore-exit-code 8

      - name: Test frontend
        run: >
          npm test -w src/frontend --
          --watch=false
          --coverage --coverage-reporters=cobertura --coverage-reporters=text-summary

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/*.cobertura.xml;src/frontend/coverage/**/cobertura-coverage.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-filefilters:-**/obj/**"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
