name: CI

on:
  push:
    branches: [main]
    # Releases: their images are tagged with the version and latest
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled, so every push to main gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore
        run: |
          npm ci
          dotnet tool restore
          dotnet restore Lookout.slnx

      # Cheap checks first, so they fail before the slow builds
      - name: Check .NET formatting
        run: dotnet format whitespace Lookout.slnx --verify-no-changes

      # The SDK goes before the TypeScript checks: the Runner and examples resolve its types from dist/
      - name: Build watch SDK
        run: npm run build -w src/watch-sdk

      - name: Lint TypeScript
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build frontend
        id: build-frontend
        run: npm run build -w src/frontend

      # Analyzers and code style are enforced here too (EnforceCodeStyleInBuild, TreatWarningsAsErrors)
      - name: Build .NET
        run: dotnet build Lookout.slnx -c Release --no-restore

      # The production deployment is generated by the AppHost; AppHost.Tests checks it's current, and this that Compose
      # accepts it. The services, not Compose, refuse the required settings left empty.
      - name: Validate deployment
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Test .NET
        id: test-dotnet
        run: >
          dotnet test --solution Lookout.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura

      # Runs even when the .NET build or tests fail, so one run reports failures on both sides
      - name: Test frontend
        id: test-frontend
        if: ${{ !cancelled() && steps.build-frontend.outcome == 'success' }}
        run: npm run test:ci -w src/frontend

      - name: Coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/*.cobertura.xml;src/frontend/coverage/**/cobertura-coverage.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-filefilters:-**/obj/**"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

  # The images the deployment runs, for both platforms a server is likely to be. Built on every run, so a broken
  # Dockerfile fails a PR, and pushed only from main and release tags, after the tests pass.
  images:
    name: ${{ matrix.image }} image
    needs: build-and-test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: lookout-backend
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/Runner/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # For the final stage on arm64; the Dockerfiles build everything else natively
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main for the latest main, sha-<commit> for every push, and the version and latest for a release tag
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
