name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled, so every push to main gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore
        run: |
          npm ci
          dotnet tool restore
          dotnet restore Lookout.slnx

      # Cheap checks first, so they fail before the slow builds
      - name: Check .NET formatting
        run: dotnet format whitespace Lookout.slnx --verify-no-changes

      # The SDK goes before the TypeScript checks: the Runner and examples resolve its types from dist/
      - name: Build watch SDK
        run: npm run build -w src/watch-sdk

      - name: Lint TypeScript
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build frontend
        id: build-frontend
        run: npm run build -w src/frontend

      # Analyzers and code style are enforced here too (EnforceCodeStyleInBuild, TreatWarningsAsErrors)
      - name: Build .NET
        run: dotnet build Lookout.slnx -c Release --no-restore

      - name: Test .NET
        id: test-dotnet
        run: >
          dotnet test --solution Lookout.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura

      # Runs even when the .NET build or tests fail, so one run reports failures on both sides
      - name: Test frontend
        id: test-frontend
        if: ${{ !cancelled() && steps.build-frontend.outcome == 'success' }}
        run: npm run test:ci -w src/frontend

      - name: Coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/*.cobertura.xml;src/frontend/coverage/**/cobertura-coverage.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-filefilters:-**/obj/**"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
