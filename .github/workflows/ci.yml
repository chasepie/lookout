name: CI

# Pushes to main run it through release.yml, which releases only once it passes
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled. On main, release.yml calls this, and its own concurrency group decides which
  # runs go ahead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore
        run: |
          npm ci
          dotnet tool restore
          dotnet restore Lookout.slnx

      # Cheap checks first, so they fail before the slow builds
      - name: Check .NET formatting
        run: dotnet format whitespace Lookout.slnx --verify-no-changes

      # The SDK goes before the TypeScript checks: the Runner and examples resolve its types from dist/
      - name: Build watch SDK
        run: npm run build -w src/watch-sdk

      - name: Lint TypeScript
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build frontend
        id: build-frontend
        run: npm run build -w src/frontend

      # Analyzers and code style are enforced here too (EnforceCodeStyleInBuild, TreatWarningsAsErrors)
      - name: Build .NET
        run: dotnet build Lookout.slnx -c Release --no-restore

      # The production deployment is generated by the AppHost; AppHost.Tests checks it's current, and this that Compose
      # accepts it. The services, not Compose, refuse the required settings left empty, except the image tag, which
      # Compose reads itself.
      - name: Validate deployment
        working-directory: deploy
        run: |
          cp .env.example .env
          LOOKOUT_IMAGE_TAG=0.1 docker compose config --quiet

      - name: Test .NET
        id: test-dotnet
        run: >
          dotnet test --solution Lookout.slnx -c Release --no-build
          --results-directory TestResults
          --coverage --coverage-output-format cobertura

      # Runs even when the .NET build or tests fail, so one run reports failures on both sides
      - name: Test frontend
        id: test-frontend
        if: ${{ !cancelled() && steps.build-frontend.outcome == 'success' }}
        run: npm run test:ci -w src/frontend

      # The CLI's tests run scripts in a local headless Chromium, which only they need
      - name: Test watch SDK
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm test -w src/watch-sdk

      - name: Coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/*.cobertura.xml;src/frontend/coverage/**/cobertura-coverage.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-filefilters:-**/obj/**"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && (steps.test-dotnet.outcome != 'skipped' || steps.test-frontend.outcome != 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

  # The images the deployment runs, built natively for both platforms a server is likely to be, so a broken Dockerfile
  # fails here. release.yml builds and pushes them from the same cache when it releases.
  images:
    name: ${{ matrix.image }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [lookout-backend, lookout-runner]
        arch: [amd64, arm64]
        include:
          - image: lookout-backend
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/Runner/Dockerfile
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          # Only from main, through release.yml: a pull request's cache can't be read from main, and would evict the one
          # release.yml's image builds read
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-{1}', matrix.image, matrix.arch) || '' }}
