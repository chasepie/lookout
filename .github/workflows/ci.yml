name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required checks in the "Merge Gate" ruleset; rename a job there too.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Lookout.slnx

  node:
    name: Runner and Scripting
    runs-on: ubuntu-latest
    # The runner tests take under a minute; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The runner's tests only (Seam 2), which serve their own pages and need no internet. Not `--workspaces`:
      # examples/ has a test against a real bot-detection site.
      - name: Test
        run: npm test
