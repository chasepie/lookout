name: CI

on:
  push:
    branches: [main]
    # A release, from gh release create (see "Releasing" in README.md)
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required checks in the "Merge Gate" ruleset; rename a job there too.
# Only Backend installs .NET; both jobs need Node and Chromium, for the real-runner and runner tests.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # The browser tests take a few minutes; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
          # Currently broken with 10.0.403 release
          # global-json-file: global.json

      - name: Build
        run: dotnet build Lookout.slnx

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Test backend and runner client
        run: dotnet test --solution Lookout.slnx --no-build

      - name: Test frontend against the backend with a fake runner
        run: npm run test:e2e

  node:
    name: Runner and Scripting
    runs-on: ubuntu-latest
    # The runner tests take under a minute; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These tests use local pages; examples/ contacts a real bot-detection site.
      - name: Test runner
        run: npm run test:runner

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # What compose.yaml deploys, so an image that no longer builds fails here rather than on a homelab. Running
      # the stack against the real Browserless is the README's manual smoke test.
      - name: Build
        run: docker compose build

  # Publishing, for pushes only: the triggers limit them to main and v* tags. A push to main publishes edge builds, and
  # a release tag publishes its version; see "Releasing" in README.md. The publishing jobs wait for every check above.
  # A newer push to main cancels this run (see concurrency), so the newest push's builds end up as edge. Re-running an
  # older run publishes its builds as edge again, until the next push.
  version:
    name: Version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, for the latest release, and main, to check a release tag is on it
          fetch-depth: 0
          persist-credentials: false

      - id: version
        run: .github/workflows/scripts/version.sh

  publish-images:
    name: Publish images
    if: github.event_name == 'push'
    needs: [backend, node, images, version]
    runs-on: ubuntu-latest
    # Two images for two platforms, arm64 partly under emulation
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # For a multi-platform image, GHCR reads the description from the index
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      # Both images' tags. From main: edge, and the commit's sha-<short SHA> to pin or roll back to. From a release tag
      # such as v0.2.0: 0.2.0, 0.2 and latest. A pre-release such as v0.2.0-rc.1 gets only 0.2.0-rc.1.
      IMAGE_TAGS: |
        type=raw,value=edge,enable={{is_default_branch}}
        type=sha,enable={{is_default_branch}}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # arm64 too, for homelabs on a Raspberry Pi. The lookout image's build stages run on the build machine's own
      # platform; only its last stage and the runner image's build run under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels include the source repository, which links each package to this repository on GitHub
      - id: lookout-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lookout
          tags: ${{ env.IMAGE_TAGS }}

      - id: runner-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lookout-runner
          tags: ${{ env.IMAGE_TAGS }}

      # Lookout and the runner must match, so both are built, for both platforms, before either is pushed: a run
      # that fails can't publish one without the other. The pushes reuse these builds from the builder's cache.
      # Built from the repository root with .dockerignore, as compose.yaml builds them. The GitHub Actions cache keeps
      # only the images' own layers, as every stage's would crowd out the npm cache.
      - name: Build lookout
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=lookout
          cache-to: type=gha,mode=min,scope=lookout

      - name: Build lookout-runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=lookout-runner
          cache-to: type=gha,mode=min,scope=lookout-runner

      - name: Push lookout
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.lookout-meta.outputs.tags }}
          labels: ${{ steps.lookout-meta.outputs.labels }}
          annotations: ${{ steps.lookout-meta.outputs.annotations }}

      - name: Push lookout-runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.runner-meta.outputs.tags }}
          labels: ${{ steps.runner-meta.outputs.labels }}
          annotations: ${{ steps.runner-meta.outputs.annotations }}

  # The types Scripts import, at the version the Version job worked out
  publish-scripting:
    name: Publish scripting package
    if: github.event_name == 'push'
    needs: [backend, node, images, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com

      # The root's devDependencies hold the TypeScript that builds the package's types. Only the publish step has the
      # token, so dependencies' install scripts can't publish with it.
      - run: npm ci --workspace src/scripting --include-workspace-root

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.npm-tag }}
        run: .github/workflows/scripts/publish-scripting.sh "$VERSION" "$DIST_TAG"
