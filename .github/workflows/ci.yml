name: CI

on:
  push:
    branches: [main]
    # A release, from gh release create (see "Releasing" in README.md)
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required checks in the "Merge Gate" ruleset; rename a job there too.
# Only Backend installs .NET; both jobs need Node and Chromium, for the real-runner and runner tests.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # The browser tests take a few minutes; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
          # Currently broken with 10.0.403 release
          # global-json-file: global.json

      - name: Build
        run: dotnet build Lookout.slnx

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Test backend and runner client
        run: dotnet test --solution Lookout.slnx --no-build

      - name: Test frontend against the backend with a fake runner
        run: npm run test:e2e

  node:
    name: Runner and Scripting
    runs-on: ubuntu-latest
    # The runner tests take under a minute; a hung run fails here rather than at GitHub's 6-hour limit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These tests use local pages; examples/ contacts a real bot-detection site.
      - name: Test runner
        run: npm run test:runner

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # What compose.yaml deploys, so an image that no longer builds fails here rather than on a homelab. Running
      # the stack against the real Browserless is the README's manual smoke test.
      - name: Build
        run: docker compose build

  # Publishing, for pushes only: the triggers limit them to main and v* tags. A push to main publishes edge builds, and
  # a release tag publishes its version; see "Releasing" in README.md. The publishing jobs wait for every check above.
  # A newer push to main cancels this run (see concurrency), so the newest push's builds end up as edge. Re-running an
  # older run publishes its builds as edge again, until the next push.
  version:
    name: Version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, for the latest release, and main, to check a release tag is on it
          fetch-depth: 0
          persist-credentials: false

      - id: version
        run: .github/workflows/scripts/version.sh

  # Each image for each platform, on a runner of that platform, so nothing runs under emulation. A build is pushed by
  # digest alone, without a tag, so nothing pulls it until Tag images has every build.
  build-images:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [backend, node, images, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lookout, lookout-runner]
        # arm64 too, for homelabs on a Raspberry Pi
        arch: [amd64, arm64]
        include:
          - image: lookout
            dockerfile: src/Backend/Dockerfile
          - image: lookout-runner
            dockerfile: src/runner/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels include the source repository, which links each package to this repository on GitHub
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      # Built from the repository root with .dockerignore, as compose.yaml builds them. The GitHub Actions cache keeps
      # only the images' own layers, as every stage's would crowd out the npm cache.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          touch "$RUNNER_TEMP/digest/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  # Joins each image's builds into one for both platforms, and tags it. Only once every build has succeeded, so
  # Lookout and the runner, which must match, are tagged together or not at all.
  tag-images:
    name: Tag images
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      # For a multi-platform image, GHCR reads the description from the index
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      # Both images' tags. From main: edge, and the commit's sha-<short SHA> to pin or roll back to. From a release tag
      # such as v0.2.0: 0.2.0, 0.2 and latest. A pre-release such as v0.2.0-rc.1 gets only 0.2.0-rc.1.
      IMAGE_TAGS: |
        type=raw,value=edge,enable={{is_default_branch}}
        type=sha,enable={{is_default_branch}}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    steps:
      # Each build's digest, in a directory named after its artifact
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lookout-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lookout
          tags: ${{ env.IMAGE_TAGS }}

      - id: runner-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lookout-runner
          tags: ${{ env.IMAGE_TAGS }}

      - name: Tag
        env:
          OWNER: ${{ github.repository_owner }}
          LOOKOUT_META: ${{ steps.lookout-meta.outputs.json }}
          RUNNER_META: ${{ steps.runner-meta.outputs.json }}
        run: |
          # tag <image> <metadata-action's JSON>
          tag() {
            local repository="ghcr.io/$OWNER/$1" args sources=()
            mapfile -t args < <(jq --raw-output '(.tags[] | "--tag", .), (.annotations[] | "--annotation", .)' <<< "$2")
            for arch in amd64 arm64; do
              for digest in "$RUNNER_TEMP/digests/digest-$1-$arch"/*; do
                sources+=("$repository@sha256:$(basename "$digest")")
              done
            done
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$(jq --raw-output '.tags[0]' <<< "$2")"
          }
          tag lookout "$LOOKOUT_META"
          tag lookout-runner "$RUNNER_META"

  # The types Scripts import, at the version the Version job worked out
  publish-scripting:
    name: Publish scripting package
    if: github.event_name == 'push'
    needs: [backend, node, images, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com

      # The root's devDependencies hold the TypeScript that builds the package's types. Only the publish step has the
      # token, so dependencies' install scripts can't publish with it.
      - run: npm ci --workspace src/scripting --include-workspace-root

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.npm-tag }}
        run: .github/workflows/scripts/publish-scripting.sh "$VERSION" "$DIST_TAG"
