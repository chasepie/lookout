# Lookout's deployment: see "Deploying" in README.md. Settings come from the environment or an .env file beside
# this one:
#   LOOKOUT_PORT                 the host port Lookout is served on (default 8080)
#   LOOKOUT_TIME_ZONE            the time zone schedules use, such as Europe/London (default UTC)
#   LOOKOUT_MAX_CONCURRENT_RUNS  how many Runs execute at once (default 2); raise the memory limits with it
#   LOOKOUT_RUNNER_MEMORY        the runner's memory limit (default 1536m): 640m per concurrent Run, plus 256m
#   LOOKOUT_BROWSERLESS_MEMORY   Browserless's memory limit (default 3g): about 1.5g per concurrent Run
#
# Each pair of services that talk shares a network of its own, so Browserless's Chromium, which loads whatever pages
# Scripts visit, can't reach Lookout. It can reach the runner, which refuses requests from web pages.
name: lookout

services:
  lookout:
    build:
      context: .
      dockerfile: src/Backend/Dockerfile
    restart: unless-stopped
    ports:
      - ${LOOKOUT_PORT:-8080}:8080
    environment:
      Runner__BaseUrl: http://runner:3000
      Scheduling__TimeZone: ${LOOKOUT_TIME_ZONE:-}
      Scheduling__MaxConcurrentRuns: ${LOOKOUT_MAX_CONCURRENT_RUNS:-2}
    # The database, in the image's data directory. Nothing else mounts it.
    volumes:
      - lookout-data:/data
    # lan: to be reached from the LAN and to send notifications to Discord and Pushover
    networks:
      - runs
      - lan
    # Runs that start before Browserless is ready would be Errored
    depends_on:
      runner:
        condition: service_started
      browserless:
        condition: service_healthy

  # Runs Scripts. It reaches only Browserless and Lookout, which calls it, and has nothing mounted: no database,
  # secrets or backend configuration (ADR-0003).
  runner:
    build:
      context: .
      dockerfile: src/runner/Dockerfile
    restart: unless-stopped
    environment:
      BROWSERLESS_URL: ws://browserless:3000/chromium/playwright
    networks:
      - runs
      - browsers
    # A minimal init as PID 1, which reaps the processes the runner kills and forwards signals to it. Node, as PID 1,
    # would leave them as zombies.
    init: true
    # The container is what limits a Script's memory outside V8's heap, such as Buffers: 640 MB for each concurrent
    # Run (a Script's 512 MB heap and Node's own) and 256 MB for the runner. Without it, a Script could take the
    # host's memory, and the kernel's OOM killer could pick the runner, ending every Run.
    mem_limit: ${LOOKOUT_RUNNER_MEMORY:-1536m}
    # Counts threads: each Node process has about a dozen, so this allows about 40 concurrent Runs
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Runs the browsers Scripts drive, the only part of a Run that reaches the internet
  browserless:
    # Its Playwright must match the runner's at the major.minor level: v2.57.1 serves Playwright 1.60 to 1.64
    image: ghcr.io/browserless/chromium:v2.57.1
    restart: unless-stopped
    environment:
      # Above the longest Run timeout, 10 minutes; its default of 30 seconds would end longer Runs
      TIMEOUT: 660000
      # As many browsers as Lookout runs Runs at once
      CONCURRENT: ${LOOKOUT_MAX_CONCURRENT_RUNS:-2}
    networks:
      - browsers
      - internet
    # The pages it renders aren't Lookout's to vouch for; one that leaks memory mustn't take the host's
    mem_limit: ${LOOKOUT_BROWSERLESS_MEMORY:-3g}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost:3000/active]
      interval: 30s
      start_period: 30s
      start_interval: 1s

networks:
  # Lookout and the runner. No route out, so a Script's own Node code can't reach the internet.
  runs:
    internal: true
  # The runner and Browserless, with no route out either
  browsers:
    internal: true
  lan:
  internet:

volumes:
  lookout-data:
